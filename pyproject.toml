[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-aeo-agent-pipeline"
version = "0.1.0"
description = "Autonomous AEO/GEO Authority Site & AI Citation Pipeline for Local Businesses"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
geo-aeo = "geo_aeo.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
